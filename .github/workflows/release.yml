# Release: on a `v*` tag, build, sign, (optionally) notarize and publish
# LyricPill-<version>.dmg as a GitHub Release. The tag must equal "v$(cat VERSION)".
#
# Repository secrets (Settings → Secrets and variables → Actions). All optional:
# with none set the DMG is ad-hoc signed and the release notes say it is not notarized.
#
#   MACOS_CERTIFICATE_P12        base64 of a "Developer ID Application" certificate
#                                exported from Keychain Access as .p12
#                                (`base64 -i DeveloperID.p12 | pbcopy`)
#   MACOS_CERTIFICATE_PASSWORD   the password that .p12 was exported with
#   APPLE_ID                     Apple ID (email) of the developer account
#   APPLE_TEAM_ID                10-character Team ID
#   APPLE_APP_PASSWORD           app-specific password for that Apple ID (appleid.apple.com)
#
# Signing needs the first two; notarization additionally needs the last three.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash  # bash -eo pipefail

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      KEYCHAIN: ${{ runner.temp }}/lyricpill-signing.keychain-db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CFBundleVersion is the commit count

      - name: Check VERSION matches the tag
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::VERSION file says '$VERSION' but the tag is '$TAG'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift run lyrics-tests

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          P12="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 contains no valid 'Developer ID Application' identity"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/build-app.sh --version "$VERSION" --sign "${IDENTITY:--}" --out build

      - name: Make DMG
        run: |
          if [ -n "${IDENTITY:-}" ]; then
            scripts/make-dmg.sh build/LyricPill.app "build/LyricPill-$VERSION.dmg" --sign "$IDENTITY"
          else
            scripts/make-dmg.sh build/LyricPill.app "build/LyricPill-$VERSION.dmg"
          fi

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh "build/LyricPill-$VERSION.dmg"

      - name: Release notes
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "$VERSION" > "$NOTES"
          if [ "$HAS_CERT" != 'true' ] || [ "$HAS_NOTARY" != 'true' ]; then
            printf '\n\nThis build is not notarized: macOS will warn on first open — see README › Install.\n' >> "$NOTES"
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          cat "$NOTES"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "build/LyricPill-$VERSION.dmg" "build/LyricPill-$VERSION.dmg.sha256" \
            --verify-tag --title "LyricPill $VERSION" --notes-file "$NOTES"

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
